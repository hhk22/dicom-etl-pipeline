[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-etl"
version = "0.1.0"
description = "Airflow mapped order batches with deterministic normalization and PostgreSQL verification"
requires-python = ">=3.12,<3.13"
dependencies = ["psycopg2-binary==2.9.10"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires an isolated PostgreSQL test schema", "airflow: requires the Airflow container"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
